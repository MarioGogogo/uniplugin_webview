apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 29
    namespace 'uni.dcloud.io.uniplugin_webview'

    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// 打 AAR 给 uni-app 时加 -PbuildAar=true
// 例: ./gradlew :uniplugin_webview:assembleRelease -PbuildAar=true
def buildAar = project.hasProperty('buildAar') && project.buildAar.toBoolean()

dependencies {    // UniApp 核心库 - 使用 compileOnly 避免重复打包
    compileOnly fileTree(dir: '../app/libs', include: ['uniapp-v8-release.aar'])

    compileOnly 'androidx.recyclerview:recyclerview:1.1.0'
    compileOnly 'androidx.appcompat:appcompat:1.1.0'
    compileOnly 'androidx.fragment:fragment:1.3.6'
    
    // Matisse
    compileOnly 'io.github.leavesczy:matisse:2.2.0'
    compileOnly 'io.coil-kt.coil3:coil-compose:3.4.0'

    implementation 'com.alibaba:fastjson:1.2.83'

    if (buildAar) {
        // 打 AAR 模式：解压 aar 为 jar，implementation 打包进去（避免 AAR 嵌套）
        implementation files('libs/x5-classes.jar')
        implementation files('libs/tbs-sdk.jar')
    } else {
        // AS 开发模式：compileOnly 引用 aar，由 app 模块提供运行时实现
        compileOnly fileTree(dir: '../app/libs', include: ['webview-x5-release.aar'])
    }
}
